name: Formal release

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  xcsc-source:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out immutable product source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: product
          persist-credentials: false
      - name: Check out the exact official xcsc source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: isarmg/xcsc
          ref: 6fca4299f5c34a79db1c7bd4e889b418d2a58e2d
          path: xcsc-policy
          persist-credentials: false
      - name: Verify manifest, immutable dependencies and exact lock source
        run: python3 xcsc-policy/scripts/check-xcsc.py --product-root product

  build:
    needs: xcsc-source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out immutable source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact annotated release identity
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="$(sed -n 's/^version = "\([0-9][0-9.]*\)"/\1/p' Cargo.toml | head -n 1)"
          test "$GITHUB_REF_NAME" = "v${version}"
          test "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" = tag
          test "$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{commit}")" = "$GITHUB_SHA"
          test -f "docs/releases/${version}.md"
      - name: Install pinned Rust toolchain and target
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt,clippy
          rustup target add x86_64-unknown-linux-gnu --toolchain 1.99.0
      - name: Read immutable independent build tool source
        id: build_tools
        run: |
          python3 - <<'PY'
          import json,os,re
          value=json.load(open('build-tools-source.json'))
          if value['repository']!='https://github.com/isarmg/xssi.git' or not isinstance(value['revision'],str) or not re.fullmatch('[0-9a-f]{40}',value['revision']):
              raise SystemExit('Pin the reviewed build tool source before release')
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:output.write('revision='+value['revision']+'\n')
          PY
      - name: Check out independent inventory producer
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: isarmg/xssi
          ref: ${{ steps.build_tools.outputs.revision }}
          path: .release-build-tools
          persist-credentials: false
      - name: Install inventory tools
        run: |
          cargo install --locked cargo-cyclonedx --version 0.5.9
          cargo install --locked cargo-audit --version 0.22.2
      - name: Install pinned Node.js for original dependency notices
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
      - name: Install archive dependency
        run: sudo apt-get update && sudo apt-get install --yes zstd
      - name: Run complete quality gate
        env:
          RUSTUP_TOOLCHAIN: 1.99.0
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets --all-features --no-run --message-format=json-render-diagnostics > "$RUNNER_TEMP/xssc-test-build.jsonl"
          python3 scripts/run-root-tests.py "$RUNNER_TEMP/xssc-test-build.jsonl"
          python3 tests/test_finalize_release.py
          python3 tests/test_release_docs.py
      - name: Stage complete release input with actual runtime inventory
        env:
          RUSTUP_TOOLCHAIN: 1.99.0
          XSSI_BUILD_TOOLS_DIR: ${{ github.workspace }}/.release-build-tools
        run: ./scripts/stage-release.sh "$RUNNER_TEMP/xssc-stage"
      - name: Upload immutable release input
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xssc-release-input-${{ github.sha }}
          path: ${{ runner.temp }}/xssc-stage
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out immutable release metadata
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download only the verified build output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: xssc-release-input-${{ github.sha }}
          path: ${{ runner.temp }}/release-input
      - name: Install archive dependency
        run: sudo apt-get update && sudo apt-get install --yes zstd
      - name: Package and verify final SHA-256 inventory
        run: |
          chmod 0755 "$RUNNER_TEMP/release-input/package/bin/xssc"
          bash "$RUNNER_TEMP/release-input/release-tools/finalize-release.sh" \
            "$RUNNER_TEMP/release-input/package" \
            "$RUNNER_TEMP/final-release" \
            "$GITHUB_SHA" "${GITHUB_REF_NAME#v}"
      - name: Publish exact release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if gh release view "${GITHUB_REF_NAME}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Refusing to reuse or overwrite existing release ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "xssc ${GITHUB_REF_NAME}" \
            --notes-file "docs/releases/${version}.md" \
            "$RUNNER_TEMP/final-release/"*
