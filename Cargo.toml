[package]
name = "xssc"
version = "1.0.1"
edition = "2024"
rust-version = "1.99"
authors = ["sarmg <isarmg@163.com>"]
license = "Apache-2.0"
description = "Fixed-root server upgrades and durable data recovery"
publish = false

[dependencies]
libc = "0.2"
anyhow = "1"
clap = { version = "4.6.7", features = ["derive"] }
xcsc = { git = "https://github.com/isarmg/xcsc.git", rev = "6fca4299f5c34a79db1c7bd4e889b418d2a58e2d", version = "=1.0.0", features = ["offline-maintenance"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustix = { version = "1.1", features = ["fs", "process", "time"] }
sha2 = "0.11"
thiserror = "2"
tempfile = "3"
uuid = { version = "1", features = ["serde", "v4"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["sqlite-bundled"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }

[dev-dependencies]
futures-executor = "0.3"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[lints.rust]
unsafe_code = "deny"
